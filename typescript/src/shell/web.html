<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tcode</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #101418; color: #d6dde6; font: 14px/1.6 "Cascadia Code", Consolas, "Microsoft YaHei", monospace; }
  header { position: sticky; top: 0; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #161b22; border-bottom: 1px solid #2a313c; }
  header b { color: #58d5c9; }
  header .model { color: #7d8590; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { background: #21262d; color: #d6dde6; border: 1px solid #363b42; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #2a313a; }
  button:disabled { opacity: .4; cursor: default; }
  #log { max-width: 860px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 120px; }
  .user { color: #79c0ff; white-space: pre-wrap; }
  .user::before { content: "你 › "; color: #555; }
  .assistant { white-space: pre-wrap; }
  .dim { color: #6e7681; font-size: 12px; white-space: pre-wrap; }
  .error { color: #f85149; white-space: pre-wrap; }
  .cmdout { color: #d2a8ff; white-space: pre-wrap; border-left: 2px solid #8957e5; padding-left: 10px; }
  details.tool { border-left: 2px solid #2f81f7; padding-left: 10px; }
  details.tool summary { cursor: pointer; color: #58d5c9; }
  details.tool pre { margin: 6px 0 0; color: #8b949e; white-space: pre-wrap; font: inherit; }
  .perm { border: 1px solid #d29922; border-radius: 8px; padding: 10px 12px; }
  .perm .title { color: #d29922; margin-bottom: 6px; }
  .perm pre { margin: 0 0 10px; color: #b0bac4; white-space: pre-wrap; font: inherit; max-height: 300px; overflow: auto; }
  .perm .bar { display: flex; gap: 8px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: #101418; border-top: 1px solid #2a313c; padding: 10px 16px; }
  #input { width: 100%; background: #161b22; color: #d6dde6; border: 1px solid #363b42; border-radius: 8px; padding: 10px 12px; font: inherit; resize: none; height: 64px; }
  #input:focus { outline: 1px solid #58d5c9; }
</style>
</head>
<body>
<header>
  <b>tcode</b>
  <span class="model" id="model">连接中…</span>
  <label><input type="checkbox" id="yolo"> yolo</label>
  <button id="new">新会话</button>
  <button id="resume">恢复</button>
  <button id="stop" disabled>停止</button>
</header>
<div id="log"></div>
<footer>
  <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行；/ 开头走命令（/help）"></textarea>
</footer>
<script>
  const token = location.pathname.split('/')[2];
  const base = `/t/${token}`;
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), stopBtn = $('stop');
  let busy = false, cur = null, lastToolPre = null, lastToolSummary = null;

  const scroll = () => window.scrollTo(0, document.body.scrollHeight);
  function row(cls, text) {
    const d = document.createElement('div');
    d.className = cls;
    if (text !== undefined) d.textContent = text;
    log.appendChild(d); scroll(); return d;
  }
  function setBusy(v) {
    busy = v; input.disabled = v; $('new').disabled = v; $('resume').disabled = v;
    stopBtn.disabled = !v;
    if (!v) { cur = null; input.focus(); }
  }
  async function post(path, body) {
    const r = await fetch(base + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    return r.json();
  }

  function renderPermission(ev) {
    cur = null;
    const d = row('perm');
    const t = document.createElement('div'); t.className = 'title'; t.textContent = `── ${ev.tool} 请求执行 ──`;
    const pre = document.createElement('pre'); pre.textContent = ev.preview;
    const bar = document.createElement('div'); bar.className = 'bar';
    const mk = (label, decision) => {
      const b = document.createElement('button'); b.textContent = label;
      b.onclick = async () => { await post('/permission', { id: ev.id, decision }); d.remove(); if (decision === 'always') $('yolo').checked = true; setBusy(true); };
      return b;
    };
    bar.append(mk('允许', 'allow'), mk('拒绝', 'deny'), mk('本会话全部允许', 'always'));
    d.append(t, pre, bar); scroll();
  }

  const es = new EventSource(base + '/events');
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    switch (ev.type) {
      case 'hello': $('model').textContent = `${ev.model} · v${ev.version}`; $('yolo').checked = ev.yolo; break;
      case 'user': cur = null; row('user', ev.text); break;
      case 'text':
        if (!cur) cur = row('assistant', '');
        cur.textContent += ev.delta; scroll(); break;
      case 'tool_call': {
        cur = null;
        const d = document.createElement('details'); d.className = 'tool';
        const s = document.createElement('summary');
        s.textContent = `⚙ ${ev.name} ${JSON.stringify(ev.args).slice(0, 120)}`;
        const pre = document.createElement('pre'); pre.textContent = '（运行中…）';
        d.append(s, pre); log.appendChild(d); scroll();
        lastToolPre = pre; lastToolSummary = s; break;
      }
      case 'tool_result':
        if (lastToolPre) lastToolPre.textContent = ev.summary;
        if (lastToolSummary) lastToolSummary.textContent = `⚙ ${ev.name} → ${ev.summary.slice(0, 80)} (${ev.ms}ms)`;
        scroll(); break;
      case 'permission': renderPermission(ev); break;
      case 'trimmed': cur = null; row('dim', `（上下文超预算，已省略 ${ev.count} 条早期工具输出）`); break;
      case 'turn_end': setBusy(false); break;
      case 'aborted': cur = null; row('dim', '（本轮已中止）'); break;
      case 'error': cur = null; row('error', '出错了：' + ev.message); break;
    }
  };

  async function sendLine() {
    const t = input.value.trim();
    if (!t || busy) return;
    input.value = '';
    if (t.startsWith('/')) {
      const r = await post('/command', { line: t });
      if (r.reset) log.innerHTML = '';
      row('cmdout', r.output || r.error || '(无输出)');
      if (typeof r.yolo === 'boolean') $('yolo').checked = r.yolo;
      if (r.exit) row('dim', '服务已退出，可关闭页面');
      return;
    }
    setBusy(true);
    const r = await post('/send', { text: t });
    if (r.error) { row('error', r.error); setBusy(false); }
  }

  $('send')?.remove;
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendLine(); }
  });
  stopBtn.onclick = () => post('/abort', {});
  $('new').onclick = async () => { const r = await post('/command', { line: '/new' }); log.innerHTML = ''; row('dim', r.output || ''); };
  $('resume').onclick = async () => { const r = await post('/command', { line: '/resume' }); row('cmdout', r.output || r.error || ''); };
  setBusy(false); input.focus();
</script>
</body>
</html>
